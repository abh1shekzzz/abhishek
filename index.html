<!DOCTYPE html>
<html>
<head>
  <title>chaotic site</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="title glitch" data-text="hi">hi</h1>

<!-- chaotic text -->
<p class="random" style="top: 60px; left: 40px;">u r lazy</p>
<p class="random" style="top: 120px; left: 500px;">i like math</p>
<p class="random" style="top: 200px; left: 200px;">wake up</p>
<p class="random" style="top: 300px; left: 800px;">touch grass</p>
<p class="random" style="top: 450px; left: 100px;">build something</p>
<p class="random" style="top: 520px; left: 600px;">discipline > motivation</p>
<p class="random" style="top: 150px; left: 900px;">why are you here</p>
<p class="random" style="top: 350px; left: 400px;">stop scrolling</p>

<!-- buttons -->
<button class="main-btn" onclick="randomText()">click me</button>
<p id="output"></p>

<button class="warn-btn" onclick="alert('go study')">don't click</button>

<!-- cursor glow -->
<div class="cursor"></div>

<script>
// random message
function randomText() {
  const messages = [
    "focus", "you got this", "code more",
    "no excuses", "start now", "keep going", "lfg"
  ];
  document.getElementById("output").innerText =
    messages[Math.floor(Math.random() * messages.length)];
}

// floating movement
const texts = document.querySelectorAll(".random");
texts.forEach(el => {
  let x = Math.random() * 2 - 1;
  let y = Math.random() * 2 - 1;

  setInterval(() => {
    let rect = el.getBoundingClientRect();
    el.style.top = (rect.top + y) + "px";
    el.style.left = (rect.left + x) + "px";
  }, 50);
});

// cursor glow
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e => {
  cursor.style.top = e.clientY + "px";
  cursor.style.left = e.clientX + "px";
});
</script>

</body>
</html>
